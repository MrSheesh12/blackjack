<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b3d22"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Suited Blackjack</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css"></head><body>
<header><div class="bal">💰 <b id="bal">$500</b></div><div id="last" class="last"></div>
<button class="ib" id="bHelp" aria-label="Rules">?</button><button class="ib" id="bHist" aria-label="History">📊</button><button class="ib" id="bMute" aria-label="Sound">🔊</button><button class="ib" id="bSet" aria-label="Settings">⚙️</button></header>
<main id="table">
 <div class="zone"><div class="lbl">Dealer <span id="dTot" class="tot"></span></div><div id="dealer" class="cards"></div></div>
 <div class="arc">BLACKJACK PAYS 3 TO 2 · <span id="ruleLine">DEALER STANDS ON SOFT 17</span><br><small>INSURANCE PAYS 2 TO 1</small></div>
 <div id="sideRes"></div>
 <div class="zone"><div id="hands"></div></div>
 <div id="banner"></div>
</main>
<section id="ctrl">
 <div id="felt"><div class="rail"></div><div class="layout"><div class="spot l2" data-b="match"><div class="ring"><div class="stack"></div><b>$0</b><button class="minus" aria-label="Remove chip">−</button></div><span class="nm">Perfect Matches</span></div><div class="spot l1" data-b="pair"><div class="ring"><div class="stack"></div><b>$0</b><button class="minus" aria-label="Remove chip">−</button></div><span class="nm">Suited Pair</span></div><div class="spot main" data-b="main"><div class="ring"><div class="stack"></div><b>$0</b><button class="minus" aria-label="Remove chip">−</button></div><span class="nm">BET</span></div><div class="spot r1" data-b="ties"><div class="ring"><div class="stack"></div><b>$0</b><button class="minus" aria-label="Remove chip">−</button></div><span class="nm">Suited Ties</span></div><div class="spot r2" data-b="sbj"><div class="ring"><div class="stack"></div><b>$0</b><button class="minus" aria-label="Remove chip">−</button></div><span class="nm">Suited BJ</span></div></div></div>
 <div id="betArea">
  <div class="tbar"><span id="hint">Main bet min $5 · side bets $1+</span><span>Total bet <b id="tBet">$0</b></span></div>
  <div class="rack" id="rack"><button class="chip pc c1" data-v="1"><i>1</i></button><button class="chip pc c5 sel" data-v="5"><i>5</i></button><button class="chip pc c10" data-v="10"><i>10</i></button><button class="chip pc c25" data-v="25"><i>25</i></button><button class="chip pc c50" data-v="50"><i>50</i></button><button class="chip pc c100" data-v="100"><i>100</i></button><button class="chip pc c500" data-v="500"><i>500</i></button></div>
  <div class="row"><button class="btn alt" id="bUndo">Undo</button><button class="btn alt" id="bClear">Clear</button><button class="btn alt" id="bX2">×2</button><button class="btn alt" id="bMax">Max</button><button class="btn alt" id="bRebet">Rebet</button></div>
  <div class="row"><button class="btn gold big" id="bDeal">Deal</button><button class="btn big" id="bRD">Rebet &amp; Deal</button></div>
 </div>
 <div id="actArea" class="hidden">
  <div class="row"><button class="btn act" id="aHit">Hit</button><button class="btn act" id="aStand">Stand</button><button class="btn act" id="aDouble">Double</button></div>
  <div class="row"><button class="btn act alt" id="aSplit">Split</button><button class="btn act alt" id="aSurr">Surrender</button></div>
 </div>
 <div id="insArea" class="hidden"><p id="insTxt">Insurance?</p><div class="row"><button class="btn gold" id="iYes">Yes</button><button class="btn alt" id="iNo">No</button></div></div>
</section>
<div id="sheet" class="sheet hidden"></div>
<div id="modal" class="hidden" role="dialog" aria-modal="true"><div class="mbox" id="mCard"></div></div>
<script src="game.js"></script></body></html>
